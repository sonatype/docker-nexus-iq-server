#
# Alpine/musl variant (./Dockerfile.alpine, 'alpine').
#
# This imports goss.common.yaml directly, NOT goss.yaml: the Alpine image is not the UBI
# image plus extras, it is a different image that happens to run the same server. It has
# no openssh built from source, no rpm/microdnf de-bloat block, and different user ids.
# Ported from alpine-expectations.groovy plus the facts in Dockerfile.alpine.
#
# Alpine differences that drove the split (all read off Dockerfile.alpine):
#   - apk, not microdnf: `apk add procps-ng findutils less rsync git which curl`
#   - uid/gid 1001, not 1000 (ARG GID/UID)
#   - login shell /sbin/nologin, not /bin/false (adduser -s)
#   - no openssh from source, so none of the ssh-* checks apply
#   - no arbitrary-UID passwd fixup in start.sh and no /etc/passwd chmod
#   - the IQ Server bundle is the linux_musl-x86_64 build
---
gossfile:
  /test/goss.common.yaml: {}

group:
  nexus:
    title: nexus-group
    exists: true
    # 1001 on Alpine (ARG GID), not 1000 as on the UBI images.
    gid: 1001

user:
  nexus:
    title: nexus-user
    exists: true
    uid: 1001
    gid: 1001
    home: /opt/sonatype/nexus-iq-server
    # `adduser -s /sbin/nologin`, where the UBI images use /bin/false.
    shell: /sbin/nologin

file:
  /opt/sonatype/nexus-iq-server:
    title: home-directory
    exists: true
    filetype: directory
    # 2755, not 0755: alpine-expectations.groovy asserts drwxr-sr-x here (setgid), which
    # busybox adduser sets when it takes ownership of an existing home directory. That
    # expectation had no `| echo $?` so it was a real assertion, unlike most of the others.
    mode: "2755"
    owner: nexus
    group: nexus
  /opt/sonatype/nexus-iq-server/start.sh:
    title: start-script
    exists: true
    filetype: file
    mode: "0755"
    # Created by `RUN echo` as root, after the COPY --chown of the install directory.
    owner: root
    group: root
    # Deliberately no `contains` here: unlike the UBI images, this start.sh has no
    # arbitrary-UID passwd fixup, because Alpine does not ship the from-source openssh
    # that requires it.

  # --- runtime packages (apk add ...) --------------------------------------
  # Asserted because they are the reason the image is not just the JRE, and because
  # alpine-expectations.groovy only ever checked curl.
  /usr/bin/git:
    title: alpine-git-present
    exists: true
  /usr/bin/rsync:
    title: alpine-rsync-present
    exists: true

  # --- de-bloat guards ------------------------------------------------------
  # Alpine has no rpm/microdnf; apk is the package manager and IS present, so unlike the
  # UBI images there is nothing to assert as removed. These pin that the RPM stack never
  # appears here by accident.
  /usr/bin/rpm:
    title: rpm-absent
    exists: false
  /usr/bin/microdnf:
    title: microdnf-absent
    exists: false
