#
# Checks that are IDENTICAL for every IQ Server image variant.
#
# Imported by goss.yaml (ubi/slim), goss.rh.yaml and goss.alpine.yaml via `gossfile:`.
# Do not add anything here that differs between variants -- put it in the variant file
# instead. In particular these all differ and are deliberately absent:
#   - the nexus uid/gid and login shell (1000 + /bin/false on UBI, 1001 + /sbin/nologin
#     on Alpine)
#   - the mode of the install directory (0755 on UBI, setgid 2755 on Alpine)
#   - start.sh, because UBI/RH need the arbitrary-UID passwd fixup asserted and Alpine
#     has no such line
# A resource declared in two files that import each other has undefined merge behaviour,
# so each path appears exactly once across a variant's import chain.
---
process:
  java:
    title: iq-process
    # The old `/proc/1/comm == java` check cannot work in a build stage -- PID 1 inside a
    # RUN is BuildKit's shell. The PID-1 contract (CMD wiring, SIGTERM trap in start.sh)
    # needs a real `docker run` smoke test.
    running: true

addr:
  tcp://localhost:8070:
    title: application-port
    reachable: true
    timeout: 5000
  tcp://localhost:8071:
    title: admin-port
    reachable: true
    timeout: 5000

file:
  # --- logs -----------------------------------------------------------------
  /var/log/nexus-iq-server:
    title: log-directory
    exists: true
    filetype: directory
    mode: "0755"
    owner: nexus
    group: nexus
  # config.yml:39 names this file clm-server.log. expectations.groovy asserted
  # clm-server-log.log, which has never existed -- it only "passed" because of the
  # `| echo $?` in the old Expectation.
  /var/log/nexus-iq-server/clm-server.log:
    title: clm-server-log
    exists: true
    filetype: file
  /var/log/nexus-iq-server/audit.log:
    title: audit-log
    exists: true
    filetype: file
  /var/log/nexus-iq-server/request.log:
    title: request-log
    exists: true
    filetype: file
  /var/log/nexus-iq-server/stderr.log:
    title: stderr-log
    exists: true
    filetype: file

  # --- install directory ----------------------------------------------------
  /opt/sonatype/nexus-iq-server/bin/nexus-iq-server:
    title: server-launcher
    exists: true
    owner: nexus
    group: nexus

  # --- work directory -------------------------------------------------------
  /sonatype-work:
    title: work-directory
    exists: true
    filetype: directory
    mode: "0755"
    owner: nexus
    group: nexus
  /sonatype-work/data:
    title: data-directory
    exists: true
    filetype: directory
    owner: nexus
    group: nexus

  # --- config ---------------------------------------------------------------
  /etc/nexus-iq-server:
    title: config-directory
    exists: true
    filetype: directory
    mode: "0755"
    owner: nexus
    group: nexus
  /etc/nexus-iq-server/config.yml:
    title: config-file
    # the old `config-file` expectation was `test -f /etc/nexus-iq-server`, which is a
    # directory -- it only passed because of `| echo $?`.
    exists: true
    filetype: file
    mode: "0644"
    # COPY --from=builder without --chown lands as root:root
    owner: root
    group: root
    contains:
      - "sonatypeWork: /sonatype-work"

  # --- required at runtime --------------------------------------------------
  /usr/bin/curl:
    title: curl-present
    # required by the image HEALTHCHECK
    exists: true

command:
  # The admin /healthcheck endpoint -- same one the image HEALTHCHECK uses.
  #
  # It returns HTTP 500 on an unlicensed server because the product-license subsystem
  # reports healthy=false / remainingDays=0. Verified against the live response body in a
  # real build. A build sandbox has no license, so asserting `status: 200` can never
  # pass. Instead assert what the image is actually responsible for: every other
  # subsystem is healthy.
  #
  # Regexes (not plain substrings) so a field-order change inside a subsystem object does
  # not break the match.
  healthcheck-subsystems:
    title: admin-healthcheck
    exec: curl -s --max-time 30 http://localhost:8071/healthcheck
    exit-status: 0
    stdout:
      - '/"database":\{[^}]*"healthy":true/'
      - '/"deadlocks":\{[^}]*"healthy":true/'
      - '/"newDatabaseConnections":\{[^}]*"healthy":true/'
      - '/"shutdown-state":\{[^}]*"healthy":true/'
      - '/"work-directory":\{[^}]*"healthy":true/'

  # Replaces the old `grep JAVA_OPTS start.sh` expectation, which was vacuous: start.sh
  # does not mention JAVA_OPTS at all (verified -- goss reported the pattern missing).
  # The real contract is the image ENV, consumed by the bin/nexus-iq-server launcher.
  java-opts-env:
    title: start-script-has-java-opts
    exec: printenv JAVA_OPTS
    exit-status: 0
    stdout:
      - "java.util.prefs.userRoot"
