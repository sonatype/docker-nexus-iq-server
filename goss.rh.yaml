#
# Red Hat Certified Container variant (Dockerfile.rh).
#
# This is an OVERLAY: `gossfile:` imports the shared suite, then adds only what is
# specific to the RH image. Everything the two images have in common -- users, dirs,
# logs, ports, config, openssh client contract, de-bloat guards -- lives in goss.yaml
# and is asserted identically for both.
#
# NOTE: the resource key really is `gossfile`, not `goss`. goss silently ignores
# unknown top-level keys, so a typo here means the imported checks just never run
# with no error. Verified against goss 0.4.10.
---
gossfile:
  /test/goss.yaml: {}

user:
  # `usermod -a -G root nexus` (Dockerfile.rh ~165). Red Hat certification expects
  # arbitrary-UID containers to work via group root, since an unknown UID still lands
  # in gid 0.
  nexus:
    title: rh-nexus-in-root-group
    exists: true
    groups:
      - nexus
      - root

file:
  # --- Red Hat Certified Container payload (COPY rh-docker /) ----------------
  /licenses:
    title: rh-licenses-directory
    exists: true
    filetype: directory
    mode: "0755"
  /help.1:
    title: rh-help-page
    exists: true
    filetype: file
    mode: "0755"
  /uid_entrypoint.sh:
    # The image ENTRYPOINT. Rewrites /etc/passwd from the template when the runtime
    # UID differs, then exec's the CMD.
    title: rh-uid-entrypoint
    exists: true
    filetype: file
    mode: "0755"
  /uid_template.sh:
    title: rh-uid-template-script
    exists: true
    filetype: file
    mode: "0755"
  /etc/passwd.template:
    # Generated at build time by `bash /uid_template.sh`; uid_entrypoint.sh sed's this
    # into /etc/passwd at startup.
    title: rh-passwd-template
    exists: true
    filetype: file
