#
# Red Hat Certified Container variant (./Dockerfile.rh, 'rh').
#
# The RH image is the UBI image plus the certification payload, so this imports
# goss.yaml -- which in turn imports goss.common.yaml -- and adds only the extras.
# Verified that goss 0.4.10 follows a chained import (rh -> ubi -> common).
---
gossfile:
  /test/goss.yaml: {}

file:
  # --- Red Hat Certified Container payload (COPY rh-docker /) ----------------
  /licenses:
    title: rh-licenses-directory
    exists: true
    filetype: directory
    mode: "0755"
  /help.1:
    title: rh-help-page
    exists: true
    filetype: file
    mode: "0755"
  /uid_entrypoint.sh:
    # The image ENTRYPOINT. Rewrites /etc/passwd from the template when the runtime UID
    # differs, then exec's the CMD.
    title: rh-uid-entrypoint
    exists: true
    filetype: file
    mode: "0755"
  /uid_template.sh:
    title: rh-uid-template-script
    exists: true
    filetype: file
    mode: "0755"
  /etc/passwd.template:
    # Generated at build time by `bash /uid_template.sh`; uid_entrypoint.sh sed's this
    # into /etc/passwd at startup.
    title: rh-passwd-template
    exists: true
    filetype: file

command:
  # `usermod -a -G root nexus` (Dockerfile.rh ~165). Red Hat certification expects
  # arbitrary-UID containers to work via group root, since an unknown UID still lands in
  # gid 0.
  #
  # Asserted with `id` rather than adding `groups:` to the `user: nexus` resource, because
  # that resource is already declared in the imported goss.yaml and a resource declared
  # twice across an import chain has undefined merge behaviour.
  nexus-in-root-group:
    title: rh-nexus-in-root-group
    exec: id -nG nexus
    exit-status: 0
    stdout:
      - '/(^|\s)root(\s|$)/'
