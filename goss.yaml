#
# UBI-based images: ./Dockerfile ('ubi') and ./Dockerfile.slim ('slim'), which are
# currently byte-identical. Also the base for goss.rh.yaml.
#
# The import key is `gossfile`, not `goss`: goss silently ignores unknown top-level keys,
# so a typo here drops every imported check with no error.
---
gossfile:
  /test/goss.common.yaml: {}

group:
  nexus:
    title: nexus-group
    exists: true
    gid: 1000

user:
  nexus:
    title: nexus-user
    exists: true
    uid: 1000
    gid: 1000
    home: /opt/sonatype/nexus-iq-server
    shell: /bin/false

file:
  /opt/sonatype/nexus-iq-server:
    title: home-directory
    exists: true
    filetype: directory
    mode: "0755"
    owner: nexus
    group: nexus
  /opt/sonatype/nexus-iq-server/start.sh:
    title: start-script
    exists: true
    filetype: file
    mode: "0755"
    # root:root: created by `RUN echo` as root, after the COPY --chown.
    owner: root
    group: root
    contains:
      # First line of start.sh: the arbitrary-UID passwd fixup openssh 10.4p1 needs
      # (CLM-42794). Paired with the /etc/passwd mode below.
      - "iqserver:"

  # Group-writable so start.sh can self-register an unmapped UID (K8s runAsUser).
  /etc/passwd:
    title: etc-passwd-group-writable
    exists: true
    filetype: file
    mode: "0664"
    group: root

  # --- openssh 10.4p1, compiled from source (CLM-42794) ---------------------
  # Client-only: the Dockerfile strips the server-side and setuid artifacts before COPYing
  # /usr/bin, /usr/libexec/openssh and /etc/ssh wholesale. These pin that contract.
  /usr/bin/ssh:
    title: ssh-client-installed
    exists: true
    filetype: file
  /etc/ssh/ssh_config:
    title: ssh-config-present
    exists: true
    filetype: file
  /usr/sbin/sshd:
    title: ssh-no-sshd
    exists: false
  /usr/libexec/openssh/sshd-session:
    title: ssh-no-sshd-session
    exists: false
  /usr/libexec/openssh/sftp-server:
    title: ssh-no-sftp-server
    exists: false
  # upstream installs this setuid root; stripped because it is unusable without host keys
  /usr/libexec/openssh/ssh-keysign:
    title: ssh-no-setuid-keysign
    exists: false

  # --- de-bloat guards: the final stage strips these to shrink the CVE surface ---
  /usr/bin/rpm:
    title: rpm-removed
    exists: false
  /usr/bin/microdnf:
    title: microdnf-removed
    exists: false
  /usr/sbin/useradd:
    title: shadow-utils-removed
    exists: false
  /usr/bin/gzip:
    title: gzip-removed
    exists: false
  /usr/bin/python3:
    title: python3-removed
    exists: false
  /sbin/nologin:
    title: nologin-symlink
    exists: true
    filetype: symlink
    linked-to: /bin/false

command:
  # Greps the binary rather than running `ssh -V`, which exits "No user exists for uid X"
  # under an unmapped UID. -a treats the binary as text, -q makes exit status the whole
  # assertion. Keep in sync with ARG OPENSSH_VERSION in the Dockerfile.
  ssh-version:
    title: ssh-version
    exec: grep -aq "OpenSSH_10\.4p1" /usr/bin/ssh
    exit-status: 0
