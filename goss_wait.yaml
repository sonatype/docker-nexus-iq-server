#
# Readiness gate for the `test` stage (the dgoss goss_wait.yaml convention).
#
# ONLY things that appear asynchronously as IQ Server starts. This is the one phase run
# with --retry-timeout; the full suite then runs once with no retry, so a wrong assertion
# fails immediately instead of burning the retry window. Anything true-or-false the instant
# the container starts belongs in the variant suites, not here.
---
process:
  java:
    title: startup-process
    running: true

addr:
  tcp://localhost:8070:
    title: startup-application-port
    reachable: true
    timeout: 5000
  tcp://localhost:8071:
    title: startup-admin-port
    reachable: true
    timeout: 5000

# No /healthcheck gate: it returns 500 on an unlicensed server, so it would never become
# true. Subsystem health is asserted once in the variant suites.

file:
  # created by the server on first start
  /sonatype-work/data:
    title: startup-data-directory
    exists: true
    filetype: directory
  /var/log/nexus-iq-server/clm-server.log:
    title: startup-clm-server-log
    exists: true
  /var/log/nexus-iq-server/audit.log:
    title: startup-audit-log
    exists: true
  /var/log/nexus-iq-server/request.log:
    title: startup-request-log
    exists: true
  /var/log/nexus-iq-server/stderr.log:
    title: startup-stderr-log
    exists: true
